<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f8ccc" />
  <meta name="description" content="苗圃经营管理：库存、出入库、养护任务与经营台账一站式管理。" />
  <title>苗圃经营管理</title>
  <style>
    :root{--bg:#f5f9fc;--surface:#fff;--ink:#17324d;--muted:#8193a5;--line:#e5edf3;--primary:#0c8bc8;--primary-2:#e8f6fd;--mint:#daf5ed;--mint-ink:#258c75;--yellow:#fff4d6;--yellow-ink:#9c7224;--rose:#ffe8eb;--rose-ink:#c2576a;--shadow:0 10px 30px rgba(28,70,102,.08);--radius:18px}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#f8fbfe 0%,#f3f8fb 100%);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);min-height:100vh}
    button,input{font:inherit} button{cursor:pointer;border:0;background:none;color:inherit}.app-shell{max-width:1180px;margin:0 auto;min-height:100vh;padding:34px 24px 38px}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.brand h1{font-size:clamp(28px,3vw,40px);letter-spacing:-.04em;margin:0 0 8px;font-weight:800}.brand p{margin:0;color:var(--muted);font-size:14px}.login-btn{padding:12px 22px;border:1px solid #98d4ec;border-radius:13px;background:#f1fbff;color:#0879ab;font-weight:700;transition:.2s}.login-btn:hover{background:#e0f6fe;transform:translateY(-1px)}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0 26px}.metric{border:1px solid var(--line);border-radius:16px;padding:17px 16px;background:var(--surface);display:flex;justify-content:space-between;align-items:flex-end;min-height:88px;box-shadow:var(--shadow)}.metric .label{font-size:13px;color:#688095;font-weight:700}.metric strong{display:block;font-size:31px;line-height:1;margin-top:9px;letter-spacing:-.05em}.metric .icon{font-size:19px;width:37px;height:37px;border-radius:11px;display:grid;place-items:center}.metric.blue .icon{background:#dff3fb;color:#168bc1}.metric.mint .icon{background:var(--mint);color:var(--mint-ink)}.metric.yellow .icon{background:var(--yellow);color:var(--yellow-ink)}.metric.rose .icon{background:var(--rose);color:var(--rose-ink)}
    .tabs{display:flex;gap:10px;overflow:auto;padding:3px 0 2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{padding:11px 21px;border-radius:999px;background:#fff;color:#6f8497;font-weight:700;white-space:nowrap;border:1px solid transparent;transition:.2s}.tab:hover{border-color:#b9ddea}.tab.active{background:var(--primary);color:#fff;box-shadow:0 9px 18px rgba(12,139,200,.2)}
    .toolbar{display:flex;gap:12px;margin:17px 0 18px}.search{position:relative;flex:1}.search input{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 16px 0 45px;color:var(--ink);outline:none;box-shadow:0 4px 14px rgba(28,70,102,.04)}.search input:focus{border-color:#81c9e7;box-shadow:0 0 0 4px rgba(12,139,200,.1)}.search svg{position:absolute;left:17px;top:14px;color:#8ea1b0}.filter-btn{height:48px;padding:0 17px;border:1px solid #cde6f1;border-radius:14px;background:#f0fafe;color:#087caf;font-weight:800;display:flex;align-items:center;gap:7px}.filter-btn.active{background:#0c8bc8;color:#fff;border-color:#0c8bc8}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 12px}.section-head h2{font-size:17px;margin:0;letter-spacing:-.02em}.section-head span{color:#8ca0af;font-size:13px}.record-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.record{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px 16px;display:flex;align-items:center;gap:13px;box-shadow:0 6px 18px rgba(28,70,102,.05);transition:.2s}.record:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(28,70,102,.1)}.thumb{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:25px;flex:none}.record:nth-child(4n+1) .thumb{background:#e4f6f5}.record:nth-child(4n+2) .thumb{background:#fff2d6}.record:nth-child(4n+3) .thumb{background:#e8ecff}.record:nth-child(4n) .thumb{background:#ffe8ec}.record-info{min-width:0;flex:1}.record-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;margin-bottom:7px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.dot.green{background:#2aac79}.dot.amber{background:#ecb83d}.dot.red{background:#de6472}.dot.blue{background:#4d9de0}.record-meta{display:flex;gap:10px;flex-wrap:wrap;color:#8193a5;font-size:12px}.record-status{font-size:12px;font-weight:800;white-space:nowrap}.status-green{color:#208d73}.status-amber{color:#a97b1e}.status-red{color:#c45568}.status-blue{color:#4386b9}.record-action{background:var(--primary);color:#fff;border-radius:11px;padding:10px 14px;font-size:13px;font-weight:800;white-space:nowrap;transition:.2s}.record-action:hover{background:#0879ad}.empty{grid-column:1/-1;background:#fff;border:1px dashed #c8d8e3;border-radius:16px;padding:38px;text-align:center;color:#8b9caa}
    .footnote{color:#8da0ae;font-size:12px;text-align:center;padding:19px 0 82px}.bottom-nav{position:fixed;z-index:10;bottom:16px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 28px));display:grid;grid-template-columns:repeat(4,1fr);padding:8px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border:1px solid rgba(220,232,240,.95);border-radius:22px;box-shadow:0 12px 36px rgba(28,70,102,.16)}.nav-item{padding:8px 0 7px;border-radius:15px;color:#93a2ad;display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:700}.nav-item svg{width:20px;height:20px}.nav-item.active{color:var(--primary);background:#edf9ff}
    .toast{position:fixed;left:50%;bottom:102px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#17324d;color:#fff;padding:12px 17px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);transition:.25s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
    dialog{border:0;border-radius:20px;padding:0;width:min(440px,calc(100% - 32px));box-shadow:0 22px 80px rgba(23,50,77,.24);color:var(--ink)}dialog::backdrop{background:rgba(23,50,77,.24);backdrop-filter:blur(3px)}.dialog-body{padding:24px}.dialog-body h3{margin:0 0 5px;font-size:20px}.dialog-body p{margin:0;color:var(--muted);font-size:13px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.detail-item{padding:12px;border-radius:12px;background:#f5f9fc}.detail-item small{display:block;color:var(--muted);margin-bottom:4px}.detail-item strong{font-size:15px}.dialog-actions{display:flex;justify-content:flex-end;gap:9px}.secondary{padding:10px 16px;border-radius:10px;background:#f1f6f9;color:#698094;font-weight:700}.primary{padding:10px 16px;border-radius:10px;background:var(--primary);color:#fff;font-weight:700}
    @media (max-width:760px){.app-shell{padding:27px 16px 26px}.topbar{align-items:center}.brand h1{font-size:28px}.login-btn{padding:10px 16px}.summary{gap:9px;margin:23px 0 20px}.metric{padding:12px 11px;min-height:82px;border-radius:14px}.metric .label{font-size:11px}.metric strong{font-size:25px}.metric .icon{width:31px;height:31px;font-size:16px;border-radius:9px}.record-list{grid-template-columns:1fr}.record{padding:14px}.toolbar{gap:8px}.filter-btn{padding:0 13px}.tabs{margin-right:-16px;padding-right:16px}.footnote{padding-bottom:82px}}
    @media (max-width:390px){.summary{grid-template-columns:repeat(2,1fr)}.brand h1{font-size:24px}.brand p{font-size:12px}.record-title{font-size:15px}}
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar"><div class="brand"><h1>苗圃经营管理</h1><p id="today">2026年10月15日 星期四 · 实时数据</p></div><button class="login-btn" id="loginBtn">登录</button></header>
    <section class="summary" aria-label="经营统计"><button class="metric blue"><div><span class="label">苗木品种</span><strong>24</strong></div><span class="icon">◫</span></button><button class="metric mint"><div><span class="label">今日出库</span><strong>18</strong></div><span class="icon">↗</span></button><button class="metric yellow"><div><span class="label">待养护</span><strong>6</strong></div><span class="icon">✦</span></button><button class="metric rose"><div><span class="label">低库存</span><strong>3</strong></div><span class="icon">!</span></button></section>
    <nav class="tabs" aria-label="状态筛选"><button class="tab active" data-filter="全部">全部</button><button class="tab" data-filter="在售">在售</button><button class="tab" data-filter="待养护">待养护</button><button class="tab" data-filter="已完成">已完成</button></nav>
    <div class="toolbar"><label class="search"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="searchInput" placeholder="搜索苗木名称、区域或编号" /></label><button class="filter-btn" id="filterBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M7 12h10M10 19h4"/></svg>筛选</button></div>
    <div class="section-head"><h2>苗圃台账</h2><span id="countText">共 8 条记录</span></div>
    <section class="record-list" id="recordList" aria-label="苗木记录"></section>
    <p class="footnote">数据每 10 秒自动刷新 · 最近同步刚刚完成</p>
  </main>
  <nav class="bottom-nav" aria-label="主导航"><button class="nav-item active" data-nav="总览"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-7h6v7"/></svg>总览</button><button class="nav-item" data-nav="养护"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18H6z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>养护</button><button class="nav-item" data-nav="台账"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>台账</button><button class="nav-item" data-nav="我的"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3"/><path d="M5 20c.7-3.2 3.1-5 7-5s6.3 1.8 7 5"/></svg>我的</button></nav>
  <div class="toast" id="toast" role="status"></div>
  <dialog id="detailDialog"><div class="dialog-body"><h3 id="dialogTitle">苗木详情</h3><p id="dialogSub">记录详情</p><div class="detail-grid"><div class="detail-item"><small>当前库存</small><strong id="dStock">—</strong></div><div class="detail-item"><small>所在区域</small><strong id="dArea">—</strong></div><div class="detail-item"><small>最近操作</small><strong id="dDate">—</strong></div><div class="detail-item"><small>责任人</small><strong id="dOwner">—</strong></div></div><div class="dialog-actions"><button class="secondary" id="closeDialog">关闭</button><button class="primary" id="markDone">登记养护</button></div></div></dialog>
  <script>
    const records=[
      {name:'桂花 · 金桂',status:'在售',statusClass:'green',meta:'A区 · 货位 01',date:'10-15 09:20',action:'查看',icon:'🌿',stock:'420 株',area:'A区 01号地',owner:'李师傅'},
      {name:'红枫 · 秋日',status:'待养护',statusClass:'amber',meta:'B区 · 货位 04',date:'10-15 08:45',action:'登记',icon:'🍁',stock:'86 株',area:'B区 04号地',owner:'王师傅'},
      {name:'海棠 · 西府',status:'在售',statusClass:'blue',meta:'C区 · 货位 02',date:'10-14 17:30',action:'查看',icon:'🌸',stock:'178 株',area:'C区 02号地',owner:'赵师傅'},
      {name:'香樟 · 3米苗',status:'低库存',statusClass:'red',meta:'D区 · 货位 07',date:'10-14 16:12',action:'补货',icon:'🌳',stock:'24 株',area:'D区 07号地',owner:'陈师傅'},
      {name:'紫薇 · 盆栽',status:'已完成',statusClass:'green',meta:'温室 02 · 货位 08',date:'10-14 14:50',action:'查看',icon:'🪴',stock:'210 盆',area:'温室 02号',owner:'李师傅'},
      {name:'乌桕 · 行道树',status:'待养护',statusClass:'amber',meta:'E区 · 货位 03',date:'10-14 11:05',action:'登记',icon:'🍃',stock:'63 株',area:'E区 03号地',owner:'周师傅'},
      {name:'银杏 · 胸径 8cm',status:'在售',statusClass:'blue',meta:'F区 · 货位 05',date:'10-13 16:40',action:'查看',icon:'🌱',stock:'115 株',area:'F区 05号地',owner:'王师傅'},
      {name:'茶梅 · 球形',status:'已完成',statusClass:'green',meta:'温室 01 · 货位 02',date:'10-13 09:18',action:'查看',icon:'🌼',stock:'92 盆',area:'温室 01号',owner:'赵师傅'}
    ];
    let activeFilter='全部'; let extraFilter=false; const list=document.querySelector('#recordList'); const count=document.querySelector('#countText');
    function render(){const q=document.querySelector('#searchInput').value.trim().toLowerCase(); let rows=records.filter(r=>(activeFilter==='全部'||r.status===activeFilter)&&(!q||`${r.name}${r.meta}${r.status}`.toLowerCase().includes(q))); if(extraFilter) rows=rows.filter(r=>r.status==='待养护'||r.status==='低库存'); count.textContent=`共 ${rows.length} 条记录`; list.innerHTML=rows.length?rows.map((r,i)=>`<article class="record"><div class="thumb">${r.icon}</div><div class="record-info"><div class="record-title"><span class="dot ${r.statusClass}"></span>${r.name}</div><div class="record-meta"><span>${r.status}</span><span>${r.meta}</span><span>${r.date}</span></div></div><button class="record-action" data-index="${records.indexOf(r)}">${r.action}</button></article>`).join(''):`<div class="empty">没有找到符合条件的记录<br><small>试试切换状态或修改搜索词</small></div>`; document.querySelectorAll('.record-action').forEach(btn=>btn.addEventListener('click',()=>openDetail(records[+btn.dataset.index])))}
    function openDetail(r){document.querySelector('#dialogTitle').textContent=r.name;document.querySelector('#dialogSub').textContent=`${r.status} · ${r.meta}`;document.querySelector('#dStock').textContent=r.stock;document.querySelector('#dArea').textContent=r.area;document.querySelector('#dDate').textContent=r.date;document.querySelector('#dOwner').textContent=r.owner;document.querySelector('#detailDialog').showModal()}
    function toast(msg){const t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
    document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');activeFilter=tab.dataset.filter;render()})); document.querySelector('#searchInput').addEventListener('input',render); document.querySelector('#filterBtn').addEventListener('click',()=>{extraFilter=!extraFilter;document.querySelector('#filterBtn').classList.toggle('active',extraFilter);toast(extraFilter?'已筛选：待养护与低库存':'已清除高级筛选');render()}); document.querySelector('#loginBtn').addEventListener('click',()=>toast('登录功能即将开放'));document.querySelector('#closeDialog').addEventListener('click',()=>document.querySelector('#detailDialog').close());document.querySelector('#markDone').addEventListener('click',()=>{document.querySelector('#detailDialog').close();toast('已登记养护任务')});document.querySelectorAll('.nav-item').forEach(item=>item.addEventListener('click',()=>{document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));item.classList.add('active'); if(item.dataset.nav!=='总览') toast(`${item.dataset.nav}模块已切换`)})); render();
  </script>
</body>
</html>
