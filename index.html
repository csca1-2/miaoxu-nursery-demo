<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>苗序｜苗圃经营管家</title><style>
:root{--ink:#194c3f;--muted:#7c9189;--green:#176b55;--pink:#fbe1e4;--mint:#e7f1ec;--sand:#f5f0e6;--line:#e8eee9}*{box-sizing:border-box}body{margin:0;background:#edf3ef;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}.app{max-width:460px;min-height:100vh;margin:auto;background:#fff;padding:34px 22px 94px;box-shadow:0 0 45px #203d3218}.brand{display:flex;align-items:center;justify-content:space-between}.brand h1{font-family:Georgia,serif;font-size:37px;font-weight:400;margin:0}.brand .mark{font-size:45px;color:#b9d0c1;line-height:1}.hello{margin:4px 0 18px;font-size:16px;color:#53695f}.summary{display:grid;grid-template-columns:1.1fr .9fr;gap:10px}.summary>div{border-radius:15px;padding:15px 17px}.summary>div:first-child{background:var(--pink)}.summary>div:last-child{background:var(--sand)}.summary span{font-size:13px;font-weight:700}.summary strong{display:block;font:700 30px Georgia,serif;margin-top:7px}.summary small{font:16px inherit}.title{font-family:Georgia,serif;font-size:21px;font-weight:400;margin:26px 0 12px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{border:0;border-radius:15px;text-align:left;padding:18px 15px;font-size:16px;color:#173b31;display:flex;align-items:center;gap:10px;justify-content:space-between}.quick button:nth-child(1){background:var(--green);color:#fff}.quick button:nth-child(2){background:var(--pink)}.quick button:nth-child(3){background:var(--mint)}.quick button:nth-child(4){background:var(--sand)}.quick em{font-style:normal;font-size:21px}.head-row{display:flex;justify-content:space-between;align-items:center}.head-row .title{margin-bottom:6px}.all{border:0;background:none;color:#39826b;font-weight:700}.alerts{border-top:1px solid var(--line)}.alert{width:100%;border:0;border-bottom:1px solid var(--line);padding:13px 0;background:#fff;display:flex;align-items:center;gap:12px;text-align:left}.thumb{width:56px;height:56px;border-radius:12px;background:#dfeddf;display:grid;place-items:center;font-size:27px}.alert:nth-child(2) .thumb{background:#eee6f3}.alert-info{flex:1}.alert-info strong{display:block;font-size:16px;margin-bottom:5px}.alert-info span{font-size:13px;color:#e16877;font-weight:700}.alert .arrow{font-size:22px;color:#90a19a}.wide{width:100%;border:0;border-radius:12px;background:#f4f8f5;padding:13px;margin-top:11px;color:#397a66;font-weight:700}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);height:75px;background:#fff;border-top:1px solid #edf0ee;display:grid;grid-template-columns:repeat(5,1fr);z-index:10}.bottom button{border:0;background:none;color:#80938c;font-size:12px}.bottom button.active{color:var(--green);font-weight:700}.bottom .plus{position:relative;font-size:12px}.plus i{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--green);color:#fff;font-size:30px;font-style:normal;margin:-26px auto 4px;box-shadow:0 5px 15px #176b5540}.toast{position:fixed;bottom:91px;left:50%;transform:translateX(-50%);background:#173b31;color:#fff;padding:11px 15px;border-radius:11px;display:none;font-size:13px}.toast.show{display:block}@media(min-width:700px){.app{margin:18px auto;border-radius:26px;min-height:calc(100vh - 36px)}}
</style></head><body><div class="app"><header class="brand"><h1>苗序</h1><div class="mark">❧</div></header><p class="hello">早上好，店里今天怎么样</p><section class="summary"><div><span>今日销售</span><strong>¥1,286</strong></div><div><span>待处理</span><strong>2 <small>单</small></strong></div></section><h2 class="title">快捷操作</h2><section class="quick"><button onclick="toast('已打开快速开单')"><span>▤　快速开单</span><b>›</b></button><button onclick="toast('已打开采购入库')"><span>▣　采购入库</span><b>›</b></button><button onclick="toast('已打开记录报损')"><span>✓　记录报损</span><b>›</b></button><button onclick="toast('已打开库存盘点')"><span>⌁　库存盘点</span><b>›</b></button></section><div class="head-row"><h2 class="title">库存提醒</h2><button class="all" onclick="toast('库存列表已打开')">全部</button></div><section class="alerts"><button class="alert" onclick="toast('发财树：库存仅剩 8 盆')"><div class="thumb">🌿</div><div class="alert-info"><strong>发财树</strong><span>仅剩 8 盆</span></div><span class="arrow">›</span></button><button class="alert" onclick="toast('蝴蝶兰：明日临期')"><div class="thumb">🌸</div><div class="alert-info"><strong>蝴蝶兰</strong><span>明日临期</span></div><span class="arrow">›</span></button></section><button class="wide" onclick="toast('库存管理已打开')">查看全部库存　›</button></div><nav class="bottom"><button class="active" onclick="toast('当前为首页')">⌂<br>首页</button><button onclick="toast('库存管理')">◇<br>库存</button><button class="plus" onclick="toast('快速开单')"><i>＋</i>开单</button><button onclick="toast('订单管理')">▤<br>订单</button><button onclick="toast('我的设置')">♙<br>我的</button></nav><div id="toast" class="toast"></div><script>function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.t);window.t=setTimeout(()=>e.classList.remove('show'),1800)}</script></body></html>
